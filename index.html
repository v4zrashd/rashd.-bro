<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — nothing here</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#0f0;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
.n{font-size:110px;font-weight:bold;color:#ff0033;text-shadow:0 0 24px #ff0033,0 0 60px #ff0033;animation:gl 2.2s infinite;user-select:none}
.fy{font-size:30px;margin:18px 0 10px;color:#0f0;text-shadow:0 0 14px #0f0;user-select:none}
.s{color:#4a4a4a;font-size:14px;user-select:none}
.s::after{content:"_";color:#0f0;animation:bl 1s infinite}
@keyframes gl{0%,100%{opacity:1;transform:translateX(0)}92%{opacity:1}93%{opacity:.4;transform:translateX(-3px)}94%{opacity:1;transform:translateX(3px)}96%{opacity:1;transform:translateX(0)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,0,.03) 3px,rgba(0,255,0,.03) 4px)}
</style>
</head>
<body>
<div class="scan"></div>
<div class="n">404</div>
<div class="fy">fuck you bro 😎</div>
<div class="s">nothing to see here</div>
</body>
</html>
